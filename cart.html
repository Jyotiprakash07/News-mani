<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Review your selected News-mani newspapers and magazine offers.">
  <title>Cart | News-mani</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top" aria-label="Primary navigation">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html" aria-label="News-mani home">
        <img src="./assets/logo.jpg" alt="News-mani logo" class="brand-logo">
        <span>News-mani</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav align-items-lg-center mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="blog.html">Blog</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#contact">Contact</a></li>
          <li class="nav-item">
            <a class="nav-link active position-relative" aria-current="page" href="cart.html">
              <i class="fas fa-shopping-cart" aria-hidden="true"></i>
              <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cartCount">0</span>
              Cart
            </a>
          </li>
          <li class="nav-item"><a class="nav-link" href="signup.html">Sign Up</a></li>
          <li class="nav-item"><a class="nav-link" href="signin.html">Sign In</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="cart-container" aria-labelledby="cart-title">
    <h1 id="cart-title" class="cart-title">Your Cart</h1>
    <ul class="cart-list" id="cartList" aria-live="polite"></ul>
    <div class="empty-cart" id="emptyCartMsg">Your cart is empty. Add newspapers or offers from the home page.</div>
    <div class="cart-total" id="cartTotal"></div>
    <div class="cart-actions">
      <a class="btn btn-primary" href="index.html#seller">Continue Shopping</a>
      <button type="button" class="clear-cart-btn" id="clearCartBtn">Clear Cart</button>
    </div>
  </main>

  <footer class="bg-light py-3 mt-5">
    <div class="footer-content text-center">
      <p>&copy; <span data-current-year>2026</span> News-mani. All rights reserved.</p>
      <div class="social-icons" aria-label="Social media links">
        <a href="#" aria-label="Facebook"><i class="bx bxl-facebook" aria-hidden="true"></i></a>
        <a href="#" aria-label="Twitter"><i class="bx bxl-twitter" aria-hidden="true"></i></a>
        <a href="#" aria-label="Pinterest"><i class="bx bxl-pinterest" aria-hidden="true"></i></a>
        <a href="#" aria-label="YouTube"><i class="bx bxl-youtube" aria-hidden="true"></i></a>
        <a href="#" aria-label="Instagram"><i class="bx bxl-instagram" aria-hidden="true"></i></a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
</body>
</html>
